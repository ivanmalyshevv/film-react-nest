services:
  backend:
    build:
      context: ./backend
    image: ghcr.io/ivanmalyshevv/film-react-nest-backend:review-3
    container_name: film-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: film-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./test/prac.init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./test/prac.films.sql:/docker-entrypoint-initdb.d/02-films.sql
      - ./test/prac.shedules.sql:/docker-entrypoint-initdb.d/03-schedules.sql
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: film-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/ivanmalyshevv/film-react-nest-frontend:review-3
    volumes:
      - react_build:/usr/share/nginx/html
    networks:
      - app-network
    command: sh -c "cp -r /app/dist/* /usr/share/nginx/html/ && echo 'Frontend copied to volume'"

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/ivanmalyshevv/film-react-nest-nginx:review-3
    container_name: film-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - react_build:/usr/share/nginx/html
    networks:
      - app-network
    depends_on:
      - frontend-
      - backend

volumes:
  pgdata:
  pgadmin-data:
  react_build:

networks:
  app-network:
    driver: bridge
